<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<article layout:fragment="content">
    <h2 th:text="#{contact.title}">Contact</h2>
    <p th:text="#{contact.description}"></p>
    <form th:action="@{/contact.html}" th:object="${contactData}" method="post">
        <label th:text="#{contact.name}">Name</label>
        <input type="text" th:field="*{name}" />
        <div class="form_error" th:errors="*{name}"></div>

        <label th:text="#{contact.email}">Email</label>
        <input type="text" th:field="*{email}" />
        <div class="form_error" th:errors="*{email}"></div>

        <label th:text="#{contact.message}">Message</label>
        <textarea rows="8" cols="50" th:field="*{message}"></textarea>
        <div class="form_error" th:errors="*{message}"></div>

        <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaKey}"></div>
        <input type="submit" class="button alt" th:value="#{contact.submit}" />
    </form>
</article>
</body>
</html>
