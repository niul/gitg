<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<article layout:fragment="content">
    <header><h2 th:text="${post.title}"></h2></header>
    <sup th:text="${#dates.format(post.createDate, 'MMMM d, yyyy')}"></sup>
    <div th:utext="${post.content}"></div>
    <a th:if="${post.previousId != '-1'}" class="button" th:href="@{/post/{id}(id=${post.previousId})}" th:text="#{post.previous}">Previous</a>
    <a th:if="${post.nextId != null}" class="button" th:href="@{/post/{id}(id=${post.nextId})}" th:text="#{post.next}">Next</a>
</article>
</body>
</html>
