<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title != null ? title : #messages.msg('header.title')}"></title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}" />
    <link rel="stylesheet" th:href="@{/static/css/style-wide.css}" />
    <link rel="shortcut icon" th:href="@{/static/images/leaf.ico}" />
    <th:block layout:fragment="head"></th:block>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div id="main">
        <div class="container">
            <div class="row">
                <div layout:fragment="content"></div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/static/js/jquery.min.js}"></script>
    <script th:src="@{/static/js/jquery.dropotron.min.js}"></script>
    <script th:src="@{/static/js/init.min.js}"></script>
</body>
</html>
