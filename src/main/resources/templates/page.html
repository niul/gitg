<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<article layout:fragment="content">
    <h2 th:text="${title != null ? title : #messages.msg('home.back')}"></h2>

    <div th:if="${page == 'services'}">
        <img class="image featured" th:src="@{/static/images/soil_leaves_services.jpg}" alt="" />
        <p th:text="#{services.section.main}"></p>
        <ul class="links">
            <li><a th:href="@{/design.html}" th:text="#{services.section.main.b1}"></a></li>
            <li><a th:href="@{/renovation.html}" th:text="#{services.section.main.b2}"></a></li>
            <li><a th:href="@{/maintenance.html}" th:text="#{services.section.main.b3}"></a></li>
            <li><a th:href="@{/clean_up.html}" th:text="#{services.section.main.b4}"></a></li>
            <li><a th:href="@{/kids_gardens.html}" th:text="#{services.section.main.b5}"></a></li>
            <li><a th:href="@{/kids_workshops.html}" th:text="#{services.section.main.b6}"></a></li>
        </ul>
    </div>

    <div th:if="${page == 'about'}">
        <img class="image featured" th:src="@{/static/images/autumn_leaves_stanley_park.jpg}" alt="" />
        <p th:each="part : ${#numbers.sequence(1, 6)}" th:text="${#messages.msg('about.section.main.p' + part)}"></p>
    </div>
    <div th:if="${page == 'design' or page == 'renovation' or page == 'maintenance'}">
        <p th:text="${#messages.msg(page + '.section.main.p1')}"></p>
        <a th:href="@{/services.html}" th:text="#{services.back}"></a>
    </div>
    <div th:if="${page == 'clean_up'}">
        <p th:text="#{cleanup.section.main.p1}"></p>
        <p th:text="#{cleanup.section.main.p2}"></p>
        <ul>
            <li th:each="part : ${#numbers.sequence(1, 4)}" th:text="${#messages.msg('cleanup.section.b' + part)}"></li>
        </ul>
        <a th:href="@{/services.html}" th:text="#{services.back}"></a>
    </div>
    <div th:if="${page == 'kids_gardens'}">
        <p th:text="#{kids_garden.section.main.p1}"></p>
        <p th:text="#{kids_garden.section.main.p2}"></p>
        <a th:href="@{/services.html}" th:text="#{services.back}"></a>
    </div>
    <div th:if="${page == 'kids_workshops'}">
        <p th:text="#{kids_workshop.section.main.p1}"></p>
        <ul>
            <li th:each="part : ${#numbers.sequence(1, 6)}" th:text="${#messages.msg('kids_workshop.section.b' + part)}"></li>
        </ul>
        <p th:text="#{kids_workshop.section.main.p2}"></p>
        <a th:href="@{/services.html}" th:text="#{services.back}"></a>
    </div>
    <div th:if="${page == 'resources'}">
        <p th:text="#{resources.section.main}"></p>
        <ul>
            <li th:each="item : ${#numbers.sequence(1, 5)}">
                <a th:href="${#messages.msg('resources.' + item + '.url')}" th:text="${#messages.msg('resources.' + item + '.name')}"></a>
            </li>
        </ul>
    </div>
    <div th:if="${page == 'sample'}" class="row">
        <div class="4u" th:each="image : ${ {'autumn_leaves.jpg', 'autumn_log.jpg', 'dandelion_forest.jpg', 'ferns.jpg', 'lucious_plant.jpg', 'summer_field.jpg'} }">
            <img class="image featured" th:src="@{/static/images/{file}(file=${image})}" alt="Garden" />
        </div>
    </div>
    <div th:if="${page == 'page_not_found'}">
        <p>Sorry, this page could not be found.</p>
        <a th:href="@{/}" th:text="#{home.back}"></a>
    </div>
</article>
</body>
</html>
