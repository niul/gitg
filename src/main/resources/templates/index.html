<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <section class="wrapper style2">
        <div class="container">
            <header class="major">
                <h2 th:text="${title}">Welcome to Growing in the Garden</h2>
                <p th:text="#{index.section.main}"></p>
            </header>
        </div>
    </section>
    <section class="wrapper style1">
        <div class="container">
            <div class="row 200%">
                <section class="4u 12u(narrower)">
                    <div class="box highlight">
                        <a th:href="@{/services.html}"><i class="icon major fa-leaf"></i></a>
                        <h3><a th:href="@{/services.html}" th:text="#{index.section.left.title}">Our Services</a></h3>
                        <p th:text="#{index.section.left.description}"></p>
                    </div>
                </section>
                <section class="4u 12u(narrower)">
                    <div class="box highlight">
                        <a th:href="@{/news.html}"><i class="icon major fa-rss"></i></a>
                        <h3><a th:href="@{/news.html}" th:text="#{index.section.middle.title}">Latest News</a></h3>
                        <p th:text="#{index.section.middle.description}"></p>
                    </div>
                </section>
                <section class="4u 12u(narrower)">
                    <div class="box highlight">
                        <a th:href="@{/about.html}"><i class="icon major fa-info"></i></a>
                        <h3><a th:href="@{/about.html}" th:text="#{index.section.right.title}">About Us</a></h3>
                        <p th:text="#{index.section.right.description}"></p>
                    </div>
                </section>
            </div>
        </div>
    </section>
</div>
</body>
</html>
